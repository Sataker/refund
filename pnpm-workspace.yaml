packages:
  - apps/*
  - packages/*

# Supply chain: no dependency install script runs (pnpm blocks builds unless allowed).
allowBuilds:
  sharp: false
  unrs-resolver: false
  # drizzle-kit (devDependency of @refund/db) pulls esbuild; its postinstall only re-checks the
  # platform binary, which pnpm already installs as an optional dependency.
  esbuild: false
