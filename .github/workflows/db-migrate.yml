name: Migrate production database

# INFRA-CI §2.4. Manual only; the `production` environment holds DATABASE_URL_DIRECT (:5432) and
# requires Enzo's approval. Migrations never run in the Vercel build.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE PRODUCTION"
        required: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirmation == 'MIGRATE PRODUCTION'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: pnpm --filter @refund/db db:migrate
      - name: Reference seed (idempotent)
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: pnpm --filter @refund/db db:seed --profile=reference
