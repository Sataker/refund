title = "Refund gitleaks config"

[extend]
useDefault = true

# The CI-only secrets in ci.yml are fixed, public, base64 of obvious phrases (INFRA-CI §2.1).
[allowlist]
description = "Public CI-only test secrets; AbacatePay's public webhook HMAC key (the same for every account, E17)"
paths = ['''^\.github/workflows/ci\.yml$''']
regexes = ['''t9dXRhHHo3yDEj5pVDYz0frf7q6bMKyMRmxx[A-Za-z0-9]+''']

# ARCHITECTURE §6.4: AbacatePay keys and generic secret keys.
[[rules]]
id = "abacatepay-api-key"
description = "AbacatePay API key"
regex = '''\babc_(?:prod|dev)_[A-Za-z0-9]{16,}\b'''
keywords = ["abc_prod_", "abc_dev_"]

[[rules]]
id = "generic-sk-secret"
description = "Generic sk_ secret key"
regex = '''\bsk_(?:live_|test_|prod_)?[A-Za-z0-9]{20,}\b'''
keywords = ["sk_"]
